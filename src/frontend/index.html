<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Served from public/, so these are real files rather than the SPA
         fallback. The deploy pipeline may rewrite rel="icon" to /__meta/icon.png;
         the .ico and the per-scheme pair are kept so the tab still has a
         readable mark on both light and dark chrome. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-32.png?v=2"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/brand/favicon-32-light.png?v=2"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fbfbfb"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0c0c0c"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>version 0.1.5</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
